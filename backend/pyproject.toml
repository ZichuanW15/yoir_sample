[project]
name = "yoir-backend"
version = "0.1.0"
description = "Yoir executable-architecture backend skeleton (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the intended FastAPI idiom.
"app/routers/*" = ["B008"]
