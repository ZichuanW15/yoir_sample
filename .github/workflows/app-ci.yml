name: Application CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/**'
      - 'docs/**'
      - 'README.md'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/**'
      - 'docs/**'
      - 'README.md'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Frontend lint, typecheck, coverage, audit and deployable web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: frontend_install
        run: npm ci --no-audit

      - name: Lint
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test once with coverage
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          npm run test:coverage -- \
            --json \
            --outputFile=artifacts/jest-results.json

      - name: Build the web bundle the backend serves
        id: web_build
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        env:
          # FastAPI serves this build at "/", so the API it calls is same-origin
          # and the base URL is a path rather than an absolute URL.
          EXPO_PUBLIC_API_URL: /api/v1
          EXPO_PUBLIC_USE_DEMO_API: 'false'
        run: npm run build:web

      - name: Production dependency audit (critical gate)
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=critical --json \
            > artifacts/npm-audit-production.json

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-evidence-${{ github.run_attempt }}
          path: |
            frontend/coverage/
            frontend/artifacts/jest-results.json
            frontend/artifacts/npm-audit-production.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the deployable web build
        if: ${{ always() && steps.web_build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-web-build-${{ github.run_attempt }}
          path: frontend/dist/web/
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend compile, Ruff, PostgreSQL tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: yoir
          POSTGRES_PASSWORD: yoir
          POSTGRES_DB: yoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoir -d yoir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yoir:yoir@localhost:5432/yoir_test
      YOIR_QA_ALLOW_DATABASE_RESET: 'true'
      JWT_SECRET: qa-ci-secret-that-is-at-least-32-characters
      CORS_ALLOW_ORIGINS: http://localhost:8081
      SEED_ON_STARTUP: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend and QA dependencies
        id: backend_install
        working-directory: backend
        run: uv sync --locked

      - name: Compile backend modules
        if: ${{ always() && steps.backend_install.outcome == 'success' }}
        working-directory: backend
        run: uv run --no-sync python -m compileall -q app reset_db.py

      - name: Check QA test code with Ruff
        if: ${{ always() && steps.backend_install.outcome == 'success' }}
        working-directory: backend
        run: uv run --no-sync ruff check tests

      - name: Check production backend with Ruff
        if: ${{ always() && steps.backend_install.outcome == 'success' }}
        working-directory: backend
        run: uv run --no-sync ruff check app reset_db.py

      - name: Full backend suite on PostgreSQL with coverage
        if: ${{ always() && steps.backend_install.outcome == 'success' }}
        working-directory: backend
        run: |
          mkdir -p artifacts/backend
          uv run --no-sync python -m pytest tests -m "not live" \
            --junitxml=artifacts/backend/pytest.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/backend/coverage.xml \
            --cov-report=html:artifacts/backend/htmlcov

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence-${{ github.run_attempt }}
          path: backend/artifacts/backend/
          if-no-files-found: warn
          retention-days: 14

  live-integration:
    name: Isolated PostgreSQL live HTTPX, TypeScript client and served web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: yoir
          POSTGRES_PASSWORD: yoir
          POSTGRES_DB: yoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yoir -d yoir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      LIVE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      LIVE_DATABASE_DSN: postgresql://yoir:yoir@localhost:5432/yoir_live_test
      LIVE_DATABASE_URL: postgresql://yoir:yoir@localhost:5432/yoir_live_test
      JWT_SECRET: qa-ci-secret-that-is-at-least-32-characters
      CORS_ALLOW_ORIGINS: http://localhost:8081

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install live integration dependencies
        run: |
          uv sync --locked --project backend
          npm --prefix frontend ci --no-audit

      - name: Build the web bundle into the backend static directory
        env:
          EXPO_PUBLIC_API_URL: /api/v1
          EXPO_PUBLIC_USE_DEMO_API: 'false'
        run: |
          npm --prefix frontend run build:web
          rm -rf backend/static
          mv frontend/dist/web backend/static

      - name: Create isolated live PostgreSQL database
        run: |
          uv run --no-sync --project backend python - <<'PY'
          import os

          import psycopg2

          admin_dsn = "postgresql://yoir:yoir@localhost:5432/postgres"
          connection = psycopg2.connect(admin_dsn)
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s",
                      ("yoir_live_test",),
                  )
                  if cursor.fetchone() is None:
                      cursor.execute("CREATE DATABASE yoir_live_test")
          finally:
              connection.close()
          assert os.environ["LIVE_DATABASE_DSN"].endswith("/yoir_live_test")
          PY

      - name: Run live HTTPX and real TypeScript client journeys
        run: |
          DATABASE_URL="$LIVE_DATABASE_URL" \
            SEED_ON_STARTUP=true \
            uv run --no-sync --project backend python -m uvicorn app.main:app \
              --app-dir backend \
              --host 127.0.0.1 \
              --port 8000 \
              > "$RUNNER_TEMP/yoir-backend-live.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent "$LIVE_API_BASE_URL/health" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$LIVE_API_BASE_URL/health" > /dev/null

          # One origin serves both: the app shell, a deep link into a dynamic
          # route (`services/[serviceId]/timeslots.html` on disk), and an API
          # path that stays a JSON 404 instead of falling back to the shell.
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8000/services/svc_1/timeslots \
            | grep -q 'id="root"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/does-not-exist)" = '404'

          uv run --no-sync --project backend python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg2

          def database_counts() -> dict[str, int]:
              connection = psycopg2.connect(os.environ["LIVE_DATABASE_DSN"])
              try:
                  with connection.cursor() as cursor:
                      counts = {}
                      for table in ("users", "services", "orders", "bookings"):
                          cursor.execute(f'SELECT count(*) FROM "{table}"')
                          counts[table] = cursor.fetchone()[0]
                      cursor.execute(
                          "SELECT count(*) FROM availability_slots WHERE status = 'open'"
                      )
                      counts["open_slots"] = cursor.fetchone()[0]
              finally:
                  connection.close()
              return counts

          output = Path(os.environ["RUNNER_TEMP"]) / "yoir-live-before.json"
          output.write_text(json.dumps(database_counts(), sort_keys=True))
          PY

          set +e
          (
            cd backend
            LIVE_API_BASE_URL="$LIVE_API_BASE_URL" \
              uv run --no-sync python -m pytest tests/test_live_api.py -q -ra \
                --junitxml="$RUNNER_TEMP/httpx-live.xml" \
                2>&1 | tee "$RUNNER_TEMP/httpx-live.log"
          )
          httpx_status=$?

          LIVE_API_BASE_URL="$LIVE_API_BASE_URL" \
            npm --prefix frontend run test:client:live \
            2>&1 | tee "$RUNNER_TEMP/typescript-client-live.log"
          typescript_status=${PIPESTATUS[0]}
          set -e

          curl --fail --silent "$LIVE_API_BASE_URL/health" > /dev/null

          export HTTPX_STATUS="$httpx_status"
          export TYPESCRIPT_STATUS="$typescript_status"
          uv run --no-sync --project backend python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg2

          before_path = Path(os.environ["RUNNER_TEMP"]) / "yoir-live-before.json"
          before = json.loads(before_path.read_text())
          connection = psycopg2.connect(os.environ["LIVE_DATABASE_DSN"])
          try:
              with connection.cursor() as cursor:
                  after = {}
                  for table in ("users", "services", "orders", "bookings"):
                      cursor.execute(f'SELECT count(*) FROM "{table}"')
                      after[table] = cursor.fetchone()[0]
                  cursor.execute(
                      "SELECT count(*) FROM availability_slots WHERE status = 'open'"
                  )
                  after["open_slots"] = cursor.fetchone()[0]
          finally:
              connection.close()

          output = Path(os.environ["RUNNER_TEMP"]) / "yoir-live-after.json"
          output.write_text(json.dumps(after, sort_keys=True))
          print(f"Live database isolation: before={before}, after={after}")

          client_statuses = (
              int(os.environ["HTTPX_STATUS"]),
              int(os.environ["TYPESCRIPT_STATUS"]),
          )
          if client_statuses == (0, 0):
              expected = {
                  # HTTPX booking + HTTPX login/logout + TypeScript booking each
                  # register one account; only the two booking journeys book slots.
                  "users": before["users"] + 3,
                  "services": before["services"],
                  "orders": before["orders"] + 2,
                  "bookings": before["bookings"] + 2,
                  "open_slots": before["open_slots"] - 2,
              }
              if after != expected:
                  raise SystemExit(
                      f"Live database isolation failed: before={before}, "
                      f"expected={expected}, after={after}"
                  )
          PY

          if [ "$httpx_status" -ne 0 ] || [ "$typescript_status" -ne 0 ]; then
            echo "Live client failure: HTTPX=$httpx_status TypeScript=$typescript_status" >&2
            exit 1
          fi

      - name: Upload live integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-integration-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yoir-backend-live.log
            ${{ runner.temp }}/httpx-live.log
            ${{ runner.temp }}/httpx-live.xml
            ${{ runner.temp }}/typescript-client-live.log
            ${{ runner.temp }}/yoir-live-before.json
            ${{ runner.temp }}/yoir-live-after.json
          if-no-files-found: warn
          retention-days: 14

  repository-evidence:
    name: Contract, Board and repository evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true

      - name: Install actionlint 1.7.12 with checksum verification
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" actionlint

      - name: Validate GitHub Actions workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml

      - name: Check OpenAPI, traceability, links, workflows and JSON
        run: |
          uv run --no-project --python 3.12.13 --with PyYAML==6.0.2 \
            python scripts/check_repository_metadata.py

      - name: Compile and test Board Insights generator
        run: |
          uv run --no-project --python 3.12.13 \
            python -m py_compile .github/scripts/board-insights.py
          uv run --no-project --python 3.12.13 \
            python -B .github/scripts/tests/test_board_insights.py -v

      - name: Check whitespace across the complete event change
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              ;;
            *)
              base_sha=""
              ;;
          esac

          if [ -z "$base_sha" ] \
            || [[ "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}"; then
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree" "$GITHUB_SHA"
          else
            git diff --check "$base_sha" "$GITHUB_SHA"
          fi
