name: Mermaid Diagrams

# Runs whenever a branch is created, on every push to any branch, and on every
# pull request - so a diagram that no longer parses is caught before review.
on:
  create:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A new branch fires both `create` and `push`; keep one run per ref.
concurrency:
  group: mermaid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Mermaid diagrams
    # `create` also fires for tags - only branch creation is interesting here.
    if: ${{ github.event_name != 'create' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11.16.0

      - name: Render diagrams
        run: .github/scripts/render-mermaid.sh build/diagrams

      - name: Publish job summary
        if: always()
        run: |
          if [ -f build/diagrams/summary.md ]; then
            cat build/diagrams/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The render step failed before producing a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rendered diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-diagrams-${{ github.run_id }}
          path: build/diagrams
          if-no-files-found: warn
          retention-days: 14

      - name: Comment the diagrams on the pull request
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- mermaid-diagrams -->';
            const path = 'build/diagrams/summary.md';
            let body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '## Mermaid diagrams\n\nThe render step failed before producing a summary.';

            const limit = 60000;
            if (body.length > limit) {
              body = body.slice(0, limit) + '\n\n_Truncated - see the workflow run for the full output._';
            }
            body = `${marker}\n${body}\n[Full run and downloadable SVG/PNG](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
