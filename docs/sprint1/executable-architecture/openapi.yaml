components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ServiceId: {name: serviceId, in: path, required: true, schema: {type: string}}
    OrderId: {name: orderId, in: path, required: true, schema: {type: string}}
    BookingId: {name: bookingId, in: path, required: true, schema: {type: string}}
    SlotId: {name: slotId, in: path, required: true, schema: {type: string}}
  responses:
    BadRequest:
      description: Validation error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorised:
      description: Authentication required
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InvalidCredentials:
      description: Generic email-or-password failure
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Actor lacks role or resource permission
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: State or concurrency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PaymentFailed:
      description: Sandbox payment failed safely
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PaymentProviderError:
      description: Stripe refused or could not be reached; no state was changed
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PaymentsUnavailable:
      description: This deployment has no Stripe credentials configured
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Role: {type: string, enum: [job_seeker, counsellor, platform_owner]}
    Modality: {type: string, enum: [online, in_person]}
    ProfileVisibility: {type: string, enum: [public, partial, restricted]}
    PrivacySettings:
      type: object
      required: [visibility]
      properties:
        visibility: {$ref: '#/components/schemas/ProfileVisibility'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1, format: password, writeOnly: true}
        client: {$ref: '#/components/schemas/RefreshClient'}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, passwordConfirmation, role]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, format: password}
        passwordConfirmation: {type: string, minLength: 8, format: password}
        role: {type: string, enum: [job_seeker, counsellor]}
    User:
      type: object
      required: [id, name, email, role, emailVerified]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        emailVerified:
          type: boolean
          description: >-
            False until the address is confirmed. An unconfirmed account can browse
            and sign in, but cannot create an order or publish a service, so the app
            uses this to show a confirmation prompt rather than to block sign-in.
    Session:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: {type: string}
        expiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
        refreshToken:
          type: string
          nullable: true
          description: >-
            Exchanged at refreshSession for a new session. Returned only on the
            response that creates it; the server keeps a digest and can never
            reproduce it. Absent when a client did not ask for a sliding session.
        refreshExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the sliding window closes if the session is never refreshed again.
            Shorter for a web client than a native one, because a browser has no
            keychain to keep the token in.
    RefreshClient:
      type: string
      enum: [web, native]
      description: >-
        Where the session will be stored, which decides the refresh lifetime. A
        device has the Keychain or Keystore; a browser has localStorage, readable by
        any script on the origin, so its window is deliberately shorter.
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, maxLength: 512}
        client: {$ref: '#/components/schemas/RefreshClient'}
    LogoutRequest:
      type: object
      additionalProperties: false
      description: >-
        Names the refresh token to revoke alongside the access token. Optional, but
        without it the session can simply be minted again, so a current client always
        sends it.
      properties:
        refreshToken: {type: string, nullable: true, maxLength: 512}
    CounsellorSummary:
      type: object
      required: [id, displayName, verificationStatus, reviewCount]
      properties:
        id: {type: string}
        displayName: {type: string}
        introduction: {type: string}
        verificationStatus: {type: string, enum: [pending, verified, rejected]}
        overallRating: {type: number, minimum: 1, maximum: 5, nullable: true}
        reviewCount: {type: integer, minimum: 0}
    Location:
      type: object
      required: [state, cityOrRegion]
      properties:
        state: {type: string}
        cityOrRegion: {type: string}
    Service:
      type: object
      required: [id, counsellor, title, description, priceMinor, currency, modalities, active, reviewCount]
      properties:
        id: {type: string}
        counsellor: {$ref: '#/components/schemas/CounsellorSummary'}
        title: {type: string}
        description: {type: string}
        priceMinor: {type: integer, minimum: 0}
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 480
          multipleOf: 15
          description: >-
            How long the session runs. Duration belongs to the service being sold,
            not to the counsellor's calendar: one person offers a short review and
            a long deep-dive out of the same working hours.
        currency: {type: string, enum: [AUD]}
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Modality'}
        location: {$ref: '#/components/schemas/Location'}
        active: {type: boolean}
        averageRating: {type: number, minimum: 1, maximum: 5, nullable: true}
        reviewCount: {type: integer, minimum: 0}
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [title, description, priceMinor, currency, modalities]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, minLength: 1, maxLength: 5000}
        priceMinor: {type: integer, minimum: 0}
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 480
          multipleOf: 15
          description: >-
            How long the session runs. Duration belongs to the service being sold,
            not to the counsellor's calendar: one person offers a short review and
            a long deep-dive out of the same working hours.
        currency: {type: string, enum: [AUD]}
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Modality'}
        location: {$ref: '#/components/schemas/Location'}
        meetingUrl:
          type: string
          maxLength: 2000
          nullable: true
          description: >-
            A standing room of the counsellor's own, such as a personal Zoom or
            Google Meet link. Left empty, every booking is given a freshly named
            room generated for it, so a counsellor never has to supply one.
    OwnService:
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          description: >-
            A service as its own counsellor sees it. Separate from Service because of
            one field: a meeting room URL is an access credential rather than a
            description, so it must not travel with the public marketplace listing.
          properties:
            meetingUrl: {type: string, nullable: true}
    AvailabilityWindow:
      type: object
      description: >-
        A stretch of the counsellor's own time. Nothing is pre-cut into sellable
        pieces: what can be booked inside it depends on which service a job seeker
        picks, and is derived at request time.
      required: [id, startsAt, endsAt]
      properties:
        id: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        hasBookings:
          type: boolean
          description: True once a session is booked inside it, so shortening it may be refused.
        modalities:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Modality'}
          description: >-
            How the counsellor can deliver during this window. It narrows when a
            service can be booked and never widens what that service supports, so
            in-person availability may differ from online. The time itself is shared:
            a booking of either kind takes the counsellor out of both.
    CreateAvailabilityWindowRequest:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        modalities:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Modality'}
          description: >-
            How the counsellor can deliver during this window. It narrows when a
            service can be booked and never widens what that service supports, so
            in-person availability may differ from online. The time itself is shared:
            a booking of either kind takes the counsellor out of both.
    UpdateAvailabilityWindowRequest:
      type: object
      additionalProperties: false
      description: At least one end is required.
      properties:
        startsAt: {type: string, format: date-time, nullable: true}
        endsAt: {type: string, format: date-time, nullable: true}
        modalities:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Modality'}
          description: >-
            How the counsellor can deliver during this window. It narrows when a
            service can be booked and never widens what that service supports, so
            in-person availability may differ from online. The time itself is shared:
            a booking of either kind takes the counsellor out of both.
    BookableStart:
      type: object
      description: >-
        One time at which a particular service can be booked, derived from the
        counsellor's windows, that service's duration and what is already taken.
        Two services sharing an hour each get their own answer, and booking either
        one changes both.
      required: [startsAt, endsAt]
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [serviceId, startsAt, modality, timezone]
      properties:
        serviceId: {type: string}
        startsAt:
          type: string
          format: date-time
          description: >-
            The chosen start. Its end follows from the service's duration, so the
            client never decides how long it is buying.
        modality: {$ref: '#/components/schemas/Modality'}
        timezone: {type: string, minLength: 1, maxLength: 100}
        preSessionBrief:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            US-42 — optional. What the job seeker wants to cover, shown to the
            counsellor on their bookings list so they can prepare.
    Order:
      type: object
      required: [id, serviceId, windowId, startsAt, endsAt, amountMinor, currency, status, paymentStatus]
      properties:
        id: {type: string}
        serviceId: {type: string}
        windowId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        amountMinor: {type: integer, minimum: 0, description: What the job seeker pays, in minor units}
        currency: {type: string, enum: [AUD]}
        status: {type: string, enum: [pending, awaiting_payment, confirmed, completed, expired, cancelled, disputed, refunded_slot_taken]}
        paymentStatus: {type: string, enum: [not_started, requires_action, processing, paid, failed, refunded, partially_refunded]}
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the slot hold lapses. The app counts down to this rather than timing the hold itself.
        amounts: {$ref: '#/components/schemas/BookingAmounts'}
        paymentProvider:
          type: string
          enum: [stripe, stub]
          description: stripe once the server has Stripe credentials, otherwise the development stub.
    BookingAmounts:
      type: object
      description: >-
        The commission and GST split, frozen when the order was created and never
        recalculated. A job seeker only ever pays totalMinor; the rest is between the
        platform and the counsellor.
      required: [totalMinor, sessionGstMinor, platformFeeMinor, platformFeeGstMinor, counsellorPayoutMinor]
      properties:
        totalMinor: {type: integer, minimum: 0}
        sessionGstMinor: {type: integer, minimum: 0, description: GST inside the session price, owed by the counsellor. 0 if they are not GST-registered.}
        platformFeeMinor: {type: integer, minimum: 0, description: The platform's commission, GST inclusive.}
        platformFeeGstMinor: {type: integer, minimum: 0, description: GST inside that commission, owed by the platform.}
        counsellorPayoutMinor: {type: integer, minimum: 0, description: Transferred to the counsellor once the session is completed.}
    OrderStatus:
      type: object
      required: [order]
      properties:
        order: {$ref: '#/components/schemas/Order'}
        booking:
          allOf: [{$ref: '#/components/schemas/BookingSummary'}]
          nullable: true
          description: Present once the payment webhook has confirmed the booking.
    BookingSummary:
      type: object
      description: A booking as the payment flow knows it, before messaging is implemented.
      required: [id, orderId, serviceId, serviceTitle, startsAt, endsAt, timezone, modality, status, paymentStatus]
      properties:
        id: {type: string}
        orderId: {type: string}
        serviceId: {type: string}
        serviceTitle: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timezone: {type: string}
        modality: {$ref: '#/components/schemas/Modality'}
        status: {type: string, enum: [confirmed, completed, paid_out, cancelled, refunded]}
        paymentStatus: {type: string, enum: [paid, refunded, partially_refunded]}
        amountMinor: {type: integer, minimum: 0}
        refundedMinor: {type: integer, minimum: 0}
        cancelledByRole:
          allOf: [{$ref: '#/components/schemas/Role'}]
          nullable: true
        preSessionBrief:
          type: string
          description: US-42 — what the job seeker asked to cover. Empty when none was given.
    CancelBookingResult:
      type: object
      required: [booking, refundedMinor, currency]
      properties:
        booking: {$ref: '#/components/schemas/BookingSummary'}
        refundedMinor: {type: integer, minimum: 0, description: What this cancellation returned to the job seeker.}
        currency: {type: string, enum: [AUD]}
    PaymentConfig:
      type: object
      required: [provider, merchantDisplayName, merchantCountryCode, currency, slotHoldMinutes, cancellationFullRefundHours, cancellationLateRefundPercent]
      properties:
        provider: {type: string, enum: [stripe, stub]}
        publishableKey: {type: string, nullable: true, description: Stripe publishable key. Designed to be public; never a secret key.}
        merchantDisplayName: {type: string}
        merchantCountryCode: {type: string, enum: [AU]}
        currency: {type: string, enum: [AUD]}
        slotHoldMinutes: {type: integer, minimum: 1}
        cancellationFullRefundHours: {type: integer, minimum: 0}
        cancellationLateRefundPercent: {type: integer, minimum: 0, maximum: 100}
    StripeOnboarding:
      type: object
      required: [url, accountId]
      properties:
        url: {type: string, format: uri, description: Single-use Stripe-hosted onboarding link; expires within minutes.}
        accountId: {type: string}
    JobSeekerProfile:
      type: object
      required: [name, email, headline, careerGoals]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        photoUrl: {type: string, nullable: true, description: An inline data URI.}
        headline: {type: string}
        careerGoals: {type: string}
    OnboardingState:
      type: object
      required: [profileComplete, verificationSubmitted, complete]
      properties:
        profileComplete: {type: boolean, description: LinkedIn URL, introduction, background and experience are all saved.}
        verificationSubmitted: {type: boolean, description: A LinkedIn URL is on file, whatever the Platform Owner has since decided about it.}
        complete: {type: boolean, description: Both of the above. Service publishing is not offered until this is true.}
    PayoutStatus:
      type: object
      required: [chargesEnabled, payoutsEnabled, onboardingRequired, gstRegistered]
      properties:
        stripeAccountId: {type: string, nullable: true}
        chargesEnabled: {type: boolean}
        payoutsEnabled: {type: boolean}
        onboardingRequired: {type: boolean, description: True until Stripe reports payoutsEnabled.}
        abn: {type: string, nullable: true}
        gstRegistered: {type: boolean}
    TaxDetailsRequest:
      type: object
      additionalProperties: false
      required: [gstRegistered]
      properties:
        abn: {type: string, nullable: true, description: 11 digits. Required when gstRegistered is true.}
        gstRegistered: {type: boolean}
        legalName: {type: string, nullable: true, maxLength: 200}
    Receipt:
      type: object
      required: [receiptNumber, issuedAt, isTaxInvoice, supplierName, buyerName, description, sessionStartsAt, totalMinor, gstMinor, currency, text]
      properties:
        receiptNumber: {type: string}
        issuedAt: {type: string, format: date-time}
        isTaxInvoice: {type: boolean, description: True only when the counsellor was GST-registered at the time of booking.}
        supplierName: {type: string, description: The counsellor, who is the supplier of the session under the agent model.}
        supplierAbn: {type: string, nullable: true}
        buyerName: {type: string}
        description: {type: string}
        sessionStartsAt: {type: string, format: date-time}
        totalMinor: {type: integer, minimum: 0}
        gstMinor: {type: integer, minimum: 0}
        currency: {type: string}
        text: {type: string, description: The rendered document.}
    CommissionStatement:
      type: object
      required: [counsellorName, platformName, platformGstRegistered, periodStart, periodEnd, lines, commissionTotalMinor, commissionGstTotalMinor, payoutTotalMinor, text]
      properties:
        counsellorName: {type: string}
        counsellorAbn: {type: string, nullable: true}
        platformName: {type: string}
        platformAbn: {type: string, nullable: true}
        platformGstRegistered: {type: boolean}
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        lines:
          type: array
          items: {$ref: '#/components/schemas/CommissionStatementLine'}
        commissionTotalMinor: {type: integer, minimum: 0}
        commissionGstTotalMinor: {type: integer, minimum: 0}
        payoutTotalMinor: {type: integer, minimum: 0}
        text: {type: string}
    CommissionStatementLine:
      type: object
      required: [bookingId, sessionStartsAt, description, sessionTotalMinor, commissionMinor, commissionGstMinor, payoutMinor]
      properties:
        bookingId: {type: string}
        sessionStartsAt: {type: string, format: date-time}
        description: {type: string}
        sessionTotalMinor: {type: integer, minimum: 0}
        commissionMinor: {type: integer, minimum: 0}
        commissionGstMinor: {type: integer, minimum: 0}
        payoutMinor: {type: integer, minimum: 0}
    PaymentIntent:
      type: object
      required: [paymentIntentId, clientSecret, status]
      properties:
        paymentIntentId: {type: string}
        clientSecret:
          type: string
          description: >-
            Authorises this one PaymentIntent and nothing else, and is handed only to
            the job seeker who owns the order. Not writeOnly: PaymentSheet reads it
            out of this response, and marking it so hid it from generated clients.
        status: {type: string, enum: [requires_payment_method, requires_action, processing, succeeded]}
    StubPaymentConfirmation:
      type: object
      required: [paymentId, paymentStatus, booking]
      properties:
        paymentId: {type: string}
        paymentStatus: {type: string, enum: [paid]}
        booking: {$ref: '#/components/schemas/StubBooking'}
    StubBooking:
      type: object
      required: [id, orderId, serviceId, serviceTitle, startsAt, endsAt, timezone, modality, status, paymentStatus]
      properties:
        id: {type: string}
        orderId: {type: string}
        serviceId: {type: string}
        serviceTitle: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timezone: {type: string}
        modality: {$ref: '#/components/schemas/Modality'}
        status: {type: string, enum: [confirmed]}
        paymentStatus: {type: string, enum: [paid]}
    Booking:
      type: object
      required: [id, orderId, serviceTitle, jobSeekerId, counsellorId, startsAt, endsAt, timezone, modality, status, paymentStatus, conversationStatus]
      properties:
        id: {type: string}
        orderId: {type: string}
        serviceTitle: {type: string}
        jobSeekerId: {type: string}
        counsellorId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        timezone: {type: string}
        modality: {$ref: '#/components/schemas/Modality'}
        deliveryInformation: {type: string, nullable: true}
        status: {type: string, enum: [held, confirmed, completed, expired, cancelled, disputed]}
        paymentStatus: {type: string, enum: [not_started, requires_action, processing, paid, failed, refunded]}
        conversationStatus: {type: string, enum: [open, closed]}
        meetingUrl:
          type: string
          nullable: true
          description: >-
            Where an online session happens, fixed when the booking is confirmed and
            never re-derived afterwards. Null for an in-person booking, which shows
            the service's meeting area instead. Returned only to the two parties:
            anyone holding this can walk into the session.
        counterpartyName:
          type: string
          description: >-
            The other person, from the caller's side of the booking: a job seeker
            sees the counsellor and vice versa. Empty where the response is about an
            order rather than somebody's diary, such as a payment confirmation.
        counterpartyRole: {$ref: '#/components/schemas/Role'}
        meetingArea:
          type: string
          description: Where an in-person session happens, as the service advertises it.
    Message:
      type: object
      required: [id, bookingId, senderId, content, createdAt]
      properties:
        id: {type: string}
        bookingId: {type: string}
        senderId: {type: string}
        content: {type: string}
        createdAt: {type: string, format: date-time}
    CreateReviewRequest:
      type: object
      additionalProperties: false
      required: [rating, comment]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, minLength: 1, maxLength: 4000}
    Review:
      type: object
      required: [id, bookingId, serviceId, jobSeekerId, rating, comment, createdAt]
      properties:
        id: {type: string}
        bookingId: {type: string}
        serviceId: {type: string}
        jobSeekerId: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string}
        createdAt: {type: string, format: date-time}
    VerificationSubmission:
      type: object
      required: [id, counsellorId, linkedInUrl, status, submittedAt]
      properties:
        id: {type: string}
        counsellorId: {type: string}
        linkedInUrl: {type: string, format: uri}
        status: {type: string, enum: [pending, verified, rejected]}
        submittedAt: {type: string, format: date-time}
        decisionReason: {type: string, nullable: true}
    PaymentOversight:
      type: object
      required: [paymentId, orderId, amountMinor, currency, paymentStatus, orderStatus]
      properties:
        paymentId: {type: string}
        orderId: {type: string}
        amountMinor: {type: integer}
        currency: {type: string, enum: [AUD]}
        paymentStatus: {type: string, enum: [not_started, requires_action, processing, paid, failed, refunded]}
        orderStatus: {type: string, enum: [pending, awaiting_payment, confirmed, completed, expired, cancelled, disputed]}
    PlatformStats:
      type: object
      required: [jobSeekers, counsellors, counsellorsPendingVerification, counsellorsAwaitingPayouts, servicesActive, bookingsByStatus, ordersAwaitingPayment, money]
      properties:
        jobSeekers: {type: integer, minimum: 0}
        counsellors: {type: integer, minimum: 0}
        counsellorsPendingVerification: {type: integer, minimum: 0}
        counsellorsAwaitingPayouts:
          type: integer
          minimum: 0
          description: >-
            Verified but not yet able to be paid. They can publish nothing anyone can
            book, so this is the queue that quietly costs the platform bookings.
        servicesActive: {type: integer, minimum: 0}
        bookingsByStatus:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        ordersAwaitingPayment: {type: integer, minimum: 0}
        money: {$ref: '#/components/schemas/PlatformMoney'}
    PlatformMoney:
      type: object
      description: >-
        Totals summed from the breakdown frozen on each order when it was paid.
        Never recalculated from the current fee settings, which would restate history
        the day somebody changes one.
      required: [grossMinor, platformFeeMinor, platformFeeGstMinor, sessionGstMinor, counsellorPayoutMinor, refundedMinor, currency]
      properties:
        grossMinor: {type: integer}
        platformFeeMinor: {type: integer}
        platformFeeGstMinor: {type: integer}
        sessionGstMinor: {type: integer}
        counsellorPayoutMinor: {type: integer}
        refundedMinor: {type: integer}
        currency: {type: string, enum: [AUD]}
    AdminBooking:
      type: object
      required: [id, serviceTitle, jobSeekerName, counsellorName, startsAt, timezone, modality, status, paymentStatus, amountMinor, refundedMinor]
      properties:
        id: {type: string}
        serviceTitle: {type: string}
        jobSeekerName: {type: string}
        counsellorName: {type: string}
        startsAt: {type: string, format: date-time}
        timezone: {type: string}
        modality: {$ref: '#/components/schemas/Modality'}
        status: {type: string}
        paymentStatus: {type: string}
        amountMinor: {type: integer}
        refundedMinor: {type: integer}
    AdminCounsellor:
      type: object
      required: [id, name, email, emailVerified, verificationStatus, payoutsEnabled, chargesEnabled, serviceCount, bookingCount, grossMinor, payoutMinor, joinedAt]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        emailVerified: {type: boolean}
        verificationStatus: {type: string, enum: [pending, verified, rejected]}
        submittedAt: {type: string, format: date-time, nullable: true}
        payoutsEnabled: {type: boolean}
        chargesEnabled: {type: boolean}
        serviceCount: {type: integer, minimum: 0}
        bookingCount: {type: integer, minimum: 0}
        grossMinor: {type: integer}
        payoutMinor: {type: integer}
        joinedAt: {type: string, format: date-time}
    AdminJobSeeker:
      type: object
      required: [id, name, email, emailVerified, bookingCount, joinedAt]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        emailVerified: {type: boolean}
        bookingCount: {type: integer, minimum: 0}
        joinedAt: {type: string, format: date-time}
    ForumBoard:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ForumPost:
      type: object
      required: [id, boardId, authorId, title, content, likeCount, createdAt]
      properties:
        id: {type: string}
        boardId: {type: string}
        authorId: {type: string}
        title: {type: string}
        content: {type: string}
        likeCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, AUTHENTICATION_REQUIRED, INVALID_CREDENTIALS, FORBIDDEN, NOT_FOUND, SLOT_UNAVAILABLE, INVALID_STATE_TRANSITION, ALREADY_REVIEWED, CONVERSATION_CLOSED, PAYMENT_FAILED, PAYMENT_PROVIDER_ERROR, PAYMENTS_UNAVAILABLE, COUNSELLOR_PAYOUTS_UNAVAILABLE]
        message: {type: string}
        fieldErrors:
          type: object
          additionalProperties: {type: string}
        requestId: {type: string}
