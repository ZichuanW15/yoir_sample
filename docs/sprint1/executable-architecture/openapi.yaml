openapi: 3.0.3
info:
  title: Yoir Executable Architecture API
  version: 0.1.0
  description: Sprint 1 published HTTP contract. Each operation declares baseline requirement IDs through x-requirement-ids.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Marketplace
  - name: Orders
  - name: Bookings
  - name: Messaging
  - name: Counsellor
  - name: Administration
paths:
  /auth/sessions:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      x-requirement-ids: [US-06, US-07]
      description: >-
        Authenticate an existing account using its stored password hash and role.
        Each successful login receives an independently revocable JWT; the default
        lifetime is 60 minutes. The response does not set a cookie. Wrong passwords
        and unknown emails both return the same generic 401 without field hints.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/users:
    post:
      tags: [Authentication]
      operationId: register
      security: []
      x-requirement-ids: [US-01, US-02, US-03, US-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Account created; caller proceeds to login
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/sessions/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security: []
      x-requirement-ids: [US-06]
      description: >-
        Exchange a refresh token for a new session, rotating it in the process: the
        presented token is spent and a successor issued, so a mobile app slides
        rather than asking for a password every hour. Presenting an already-spent
        token means a copy is circulating, so the whole family descended from that
        login is revoked and both parties must sign in again. Unknown, spent, revoked
        and expired all answer 401 alike, so a caller holding a bad token learns
        nothing from which. Takes no bearer token — the access token has normally
        expired by the time this is called.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshSessionRequest'}
      responses:
        '200':
          description: Rotated authenticated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorised'}
  /auth/password-reset-requests:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      security: []
      x-requirement-ids: [US-70]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: Generic accepted response whether or not account exists}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/email-verifications:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      security: []
      x-requirement-ids: [US-06]
      description: >-
        Spend a confirmation link and mark the address verified. The response is a
        full session: someone who has just proved they own the address should not
        then be asked for their password, since the link is itself the evidence.
        Links work once and expire; unknown, spent and expired all answer 400 alike.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: {type: string}
      responses:
        '200':
          description: Address confirmed, with a session for the confirmed account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/email-verification-requests:
    post:
      tags: [Authentication]
      operationId: requestEmailVerification
      security: []
      x-requirement-ids: [US-06]
      description: >-
        Send a fresh confirmation link, superseding any still outstanding. Always
        202, whether or not the address has an account and whether or not it is
        already confirmed, so this cannot be used to discover who has registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: Generic accepted response whether or not account exists}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/password-resets:
    post:
      tags: [Authentication]
      operationId: resetPassword
      security: []
      x-requirement-ids: [US-70]
      description: >-
        Spend a reset link and set a new password. Every other session ends: refresh
        token families are revoked and access tokens issued before the reset stop
        being accepted. A reset usually means the account was compromised, so leaving
        the attacker's sessions alive would defeat it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, passwordConfirmation]
              additionalProperties: false
              properties:
                token: {type: string}
                password: {type: string, format: password, writeOnly: true}
                passwordConfirmation: {type: string, format: password, writeOnly: true}
      responses:
        '204': {description: Password changed and every other session ended}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/sessions/current:
    delete:
      tags: [Authentication]
      operationId: logout
      x-requirement-ids: [US-08]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
      description: >-
        Invalidate only the presented bearer token on the server. Success returns
        an empty 204 after the revocation is committed. Retrying logout with the
        same correctly signed, unexpired revoked token also returns 204. Missing,
        malformed or expired tokens return 401. Other login sessions remain valid.
      responses:
        '204': {description: Session invalidated}
        '401': {$ref: '#/components/responses/Unauthorised'}
  /services:
    get:
      tags: [Marketplace]
      operationId: listServices
      security: []
      x-requirement-ids: [US-44, US-45]
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: modality, in: query, schema: {$ref: '#/components/schemas/Modality'}}
      responses:
        '200':
          description: Active public services
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Service'}
  /services/{serviceId}:
    parameters:
      - {$ref: '#/components/parameters/ServiceId'}
    get:
      tags: [Marketplace]
      operationId: getService
      security: []
      x-requirement-ids: [US-46]
      responses:
        '200':
          description: Public service detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '404': {$ref: '#/components/responses/NotFound'}
  /services/{serviceId}/slots:
    parameters:
      - {$ref: '#/components/parameters/ServiceId'}
    get:
      tags: [Marketplace]
      operationId: listServiceSlots
      parameters:
        - name: modality
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Modality'}
          description: Offers are per delivery method, since availability can differ by it.
      security: []
      x-requirement-ids: [US-40]
      responses:
        '200':
          description: Currently open slots only
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BookableStart'}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      x-required-role: job_seeker
      x-requirement-ids: [US-41, US-42, US-47]
      description: >-
        Holds the slot and freezes the amount breakdown. The price is read from the
        service row and never taken from the request. Refused with
        COUNSELLOR_PAYOUTS_UNAVAILABLE when the counsellor has not completed Stripe
        onboarding, since money we cannot pass on should not be taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Slot reserved and pending-payment order created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /orders/{orderId}:
    parameters:
      - {$ref: '#/components/parameters/OrderId'}
    get:
      tags: [Orders]
      operationId: getOrder
      x-required-role: job_seeker
      x-requirement-ids: [US-41, US-47]
      description: >-
        Authoritative payment outcome for one order. PaymentSheet reporting success
        only means Stripe accepted the card; the booking appears here once the
        payment_intent.succeeded webhook has been processed, so the app polls this
        rather than trusting its own result.
      responses:
        '200':
          description: Order state, with the booking once payment is confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderStatus'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders/{orderId}/payment-intents:
    parameters:
      - {$ref: '#/components/parameters/OrderId'}
    post:
      tags: [Orders]
      operationId: createPaymentIntent
      x-required-role: job_seeker
      x-requirement-ids: [US-47]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Stripe Test PaymentIntent details for PaymentSheet; booking is not yet confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentIntent'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/PaymentFailed'}
  /payments/stripe/webhook:
    post:
      tags: [Orders]
      operationId: processStripeWebhook
      security: []
      x-authentication: Stripe-Signature over raw request body
      x-requirement-ids: [US-41, US-47, US-68]
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Event processed or duplicate event acknowledged as a no-op}
        '400': {$ref: '#/components/responses/BadRequest'}
  /payments/stripe/webhook/connect:
    post:
      tags: [Orders]
      operationId: processStripeConnectWebhook
      security: []
      x-authentication: Stripe-Signature over raw request body, connected-account signing secret
      x-requirement-ids: [US-47]
      description: >-
        Connected-account events. account.updated is the only authority on whether a
        counsellor may be listed and booked; chargesEnabled and payoutsEnabled are
        never set from the app or inferred from a counsellor finishing onboarding.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Event processed or duplicate event acknowledged as a no-op}
        '400': {$ref: '#/components/responses/BadRequest'}
  /payments/stripe/onboarding/return:
    get:
      tags: [Counsellor]
      operationId: stripeOnboardingReturn
      security: []
      x-requirement-ids: [US-47]
      description: >-
        Where Stripe-hosted onboarding sends the counsellor when it closes. Reaching
        it is not evidence that onboarding succeeded, so it only redirects into the
        app, which then re-reads getPayoutStatus.
      responses:
        '303': {description: Redirect to the app deep link}
  /payments/stripe/onboarding/refresh:
    get:
      tags: [Counsellor]
      operationId: stripeOnboardingRefresh
      security: []
      x-requirement-ids: [US-47]
      description: >-
        Where Stripe sends the counsellor when an Account Link has expired. The
        request carries no session, so the connected account id travels in a signed
        token this server put in the link.
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}}
      responses:
        '303': {description: Redirect to a freshly minted Account Link}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/PaymentProviderError'}
  /payments/config:
    get:
      tags: [Orders]
      operationId: getPaymentConfig
      security: []
      x-requirement-ids: [US-47]
      description: >-
        Publishable Stripe key and the policy numbers the checkout screen must show.
        Served rather than bundled so rotating a key, or moving between test and live,
        needs no new app build. Nothing secret is returned.
      responses:
        '200':
          description: Public payment configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentConfig'}
  /orders/{orderId}/payments/stub:
    parameters:
      - {$ref: '#/components/parameters/OrderId'}
    post:
      tags: [Orders]
      operationId: completeStubPayment
      x-required-role: job_seeker
      x-requirement-ids: [US-47, US-68]
      description: Development payment boundary used while CLIENT-02 remains unresolved. It accepts no card data and charges no real money.
      responses:
        '200':
          description: Stub payment recorded and booking confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StubPaymentConfirmation'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/bookings:
    get:
      tags: [Bookings]
      operationId: listMyBookings
      x-required-role: job_seeker_or_counsellor
      x-requirement-ids: [US-42]
      responses:
        '200':
          description: Caller-owned bookings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BookingSummary'}
        '401': {$ref: '#/components/responses/Unauthorised'}
  /bookings/{bookingId}:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    get:
      tags: [Bookings]
      operationId: getBooking
      x-required-role: participant_or_platform_owner
      x-requirement-ids: [US-43, US-68]
      responses:
        '200':
          description: Authorised booking detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingSummary'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bookings/{bookingId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    post:
      tags: [Bookings]
      operationId: cancelBooking
      x-required-role: participant
      x-requirement-ids: [US-42, US-47]
      description: >-
        Cancel a confirmed booking and refund per policy. A counsellor cancelling
        always refunds the job seeker in full; a job seeker is refunded in full
        outside the notice window and at the configured late-cancellation percentage
        inside it. After payout the counsellor's transfer is reversed first, so the
        refund is funded before it is issued.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {reason: {type: string, maxLength: 500}}
      responses:
        '200':
          description: Booking cancelled and any refund issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelBookingResult'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/PaymentProviderError'}
  /bookings/{bookingId}/receipt:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    get:
      tags: [Bookings]
      operationId: getBookingReceipt
      x-required-role: participant
      x-requirement-ids: [US-47]
      description: >-
        The job seeker's receipt, issued in the counsellor's name because the
        counsellor is the supplier of the session under the agent model. It is a tax
        invoice only when that counsellor was GST-registered at the time of booking,
        and is built from the order's frozen snapshot rather than their current
        settings.
      responses:
        '200':
          description: Receipt or tax invoice for a confirmed booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Receipt'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bookings/{bookingId}/reschedule:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    post:
      tags: [Bookings]
      operationId: rescheduleBooking
      x-required-role: booking_participant
      x-requirement-ids: [US-69]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newSlotId]
              properties:
                newSlotId: {type: string}
      responses:
        '200':
          description: Booking moved atomically to new open slot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/messages:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    get:
      tags: [Messaging]
      operationId: listMessages
      x-required-role: booking_participant
      x-requirement-ids: [US-49, US-50]
      responses:
        '200':
          description: Order-linked message history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Message'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Messaging]
      operationId: sendMessage
      x-required-role: booking_participant
      x-requirement-ids: [US-50, US-62, US-63]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '201':
          description: Message appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/completion:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    post:
      tags: [Bookings]
      operationId: completeBooking
      x-required-role: booked_counsellor
      x-requirement-ids: [US-53]
      responses:
        '200':
          description: Completed booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/review:
    parameters:
      - {$ref: '#/components/parameters/BookingId'}
    post:
      tags: [Bookings]
      operationId: createReview
      x-required-role: owning_job_seeker
      x-requirement-ids: [US-53, US-54, US-55]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReviewRequest'}
      responses:
        '201':
          description: Review stored and aggregates updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Review'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/services:
    get:
      tags: [Counsellor]
      operationId: listOwnServices
      x-required-role: counsellor
      x-requirement-ids: [US-34, US-36]
      responses:
        '200':
          description: Caller-owned services
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OwnService'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Counsellor]
      operationId: createService
      x-required-role: eligible_counsellor
      x-requirement-ids: [US-34, US-35, US-37, US-38]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateServiceRequest'}
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnService'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/services/{serviceId}:
    parameters:
      - {$ref: '#/components/parameters/ServiceId'}
    patch:
      tags: [Counsellor]
      operationId: updateService
      x-required-role: counsellor
      x-requirement-ids: [US-36]
      description: >-
        Edit a service the caller owns. The body is the whole service rather than a
        patch of changed fields, because the edit form submits every field and a
        partial update would silently drop a cleared location. Bookings already made
        are unaffected: each carries its own frozen price and details.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateServiceRequest'}
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnService'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Counsellor]
      operationId: deleteService
      x-required-role: counsellor
      x-requirement-ids: [US-36]
      description: >-
        Withdraw a service from the Marketplace. A soft delete: bookings, orders and
        receipts reference the service, and a job seeker who paid for a session must
        still be able to see what they bought, so the listing is deactivated rather
        than erased. Repeating the call is not an error.
      responses:
        '204': {description: Service withdrawn from the Marketplace}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/availability-windows:
    get:
      tags: [Counsellor]
      operationId: listOwnAvailabilityWindows
      x-required-role: counsellor
      x-requirement-ids: [US-39]
      responses:
        '200':
          description: The caller's whole calendar, soonest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AvailabilityWindow'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Counsellor]
      operationId: createAvailabilityWindow
      x-required-role: counsellor
      x-requirement-ids: [US-39, US-41]
      description: >-
        Declare a stretch of time the counsellor is available. A window names no
        service: availability belongs to the person, and every service they offer can
        be booked inside it. Windows that overlap or touch are merged, because two
        stretches that meet describe one longer stretch.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAvailabilityWindowRequest'}
      responses:
        '201':
          description: Availability declared, merged with anything it touched
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityWindow'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/availability-windows/{windowId}:
    parameters:
      - {name: windowId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [Counsellor]
      operationId: updateAvailabilityWindow
      x-required-role: counsellor
      x-requirement-ids: [US-39, US-41]
      description: >-
        Move a window's boundaries. Refused when a booked session would fall outside
        the result: that time has already been paid for, and the way out is to cancel
        the booking.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAvailabilityWindowRequest'}
      responses:
        '200':
          description: Window moved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityWindow'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Counsellor]
      operationId: deleteAvailabilityWindow
      x-required-role: counsellor
      x-requirement-ids: [US-39]
      responses:
        '204': {description: Availability withdrawn}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
